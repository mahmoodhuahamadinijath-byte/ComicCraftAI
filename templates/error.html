<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {{ app_name }} - Error
    </title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

</head>

<body>

<main class="container narrow">

    <section class="card">

        <span class="badge">
            GENERATION ERROR
        </span>

        <h1>
            Something went wrong.
        </h1>

        <p class="error">
            {{ error }}
        </p>

        <a
            class="button"
            href="/"
        >
            Back to ComicCraft
        </a>

    </section>

</main>

</body>

</html>
